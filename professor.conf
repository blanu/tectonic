# Tectonic Configuration: Professor (Ollama with Korean Support)
# Save as: /opt/tectonic/configs/professor.conf

# Application to run (required)
APP_COMMAND="ollama serve"

# Display name for the application
APP_NAME="Professor (Ollama)"

# Packages to install (space-separated)
PACKAGES="curl ca-certificates bash"

# Locale settings
LOCALE="ko_KR.UTF-8"
TIMEZONE="Asia/Seoul"
KEYBOARD_LAYOUT="kr"

# Input method for CJK languages (ibus or fcitx)
INPUT_METHOD="ibus"

# Additional fonts (space-separated)
# Options: chinese japanese korean all
FONTS="korean"
